aid: lido
name: Lido
description: 'Lido is the leading liquid staking protocol on Ethereum, allowing anyone
  to stake ETH without locking it or running validator infrastructure. Stakers deposit
  ETH and receive stETH — a rebasing ERC-20 that earns daily staking rewards — or
  its non-rebasing wrapped form wstETH used widely across DeFi. Lido is governed by
  the Lido DAO via the LDO token, Snapshot signaling, on-chain Aragon voting, and
  a Dual Governance timelock that gives stETH holders a dynamic veto over the DAO.
  The protocol''s validator set is delegated across multiple Staking Modules — the
  Curated Module (professional node operators), Simple DVT (distributed validator
  technology via Obol and SSV), the Community Staking Module (permissionless solo
  stakers backed by bonded stETH), and stVaults (modular tailored setups). At over
  $18B TVL and 8.8M+ ETH staked, Lido is the #1 liquid staking provider by total value
  locked. Lido previously operated on Polygon (stMATIC, sunset June 2025) and Solana
  (stSOL, sunset February 2024); the protocol is now Ethereum-only. Lido publishes
  the open-source core smart contracts, a TypeScript SDK (`@lidofinance/lido-ethereum-sdk`),
  a Python oracle daemon, validator monitoring tooling, frontend widgets, and three
  public read-only HTTP APIs for protocol APR, reward history, and withdrawal queue
  timing.'
