apis:
- aid: lido:lido-apr-api
  name: Lido APR API
  description: Read-only HTTP API returning the latest stETH staking APR and a 7-day
    simple moving average APR. Used by integrators, dashboards, and DeFi protocols
    to display Lido's current annualized yield. The Lido V2+ APR is computed from
    on-chain rebase events. A Hoodi testnet endpoint mirrors the same shape.
  humanURL: https://docs.lido.fi/integrations/api
  tags:
  - APR
  - Yield
  - stETH
  - Statistics
  properties:
  - type: Documentation
    url: https://docs.lido.fi/integrations/api
  - type: Endpoint
    url: https://eth-api.lido.fi/v1/protocol/steth/apr/last
  - type: Endpoint
    url: https://eth-api.lido.fi/v1/protocol/steth/apr/sma
  - type: Endpoint
    url: https://eth-api-hoodi.testnet.fi/v1/protocol/steth/apr/last
  - url: graphql/lido-graphql.md
    type: GraphQL
- aid: lido:lido-reward-history-api
  name: Lido Reward History API
  description: Read-only HTTP API returning a per-address stETH reward history including
    USD/EUR/GBP fiat conversions, with options to filter to rewards-only, sort, paginate,
    and choose archival rate sources. Used by wallets, tax tools, and accounting integrations
    to surface a staker's accrued rewards.
  humanURL: https://docs.lido.fi/integrations/api
  tags:
  - Rewards
  - History
  - stETH
  - Accounting
  properties:
  - type: Documentation
    url: https://docs.lido.fi/integrations/api
  - type: Endpoint
    url: https://reward-history-backend.lido.fi/
  - type: Endpoint
    url: http://reward-history-backend-hoodi.testnet.fi/
- aid: lido:lido-withdrawals-api
  name: Lido Withdrawals API
  description: Read-only HTTP API for the Lido stETH withdrawal queue. Returns estimated
    finalization times for one or more withdrawal request IDs, and can forecast the
    expected wait time for a hypothetical withdrawal amount. Used by the Lido staking
    widget and third-party UIs that surface unstake timing.
  humanURL: https://docs.lido.fi/integrations/api
  tags:
  - Withdrawals
  - Queue
  - stETH
  - Unstake
  properties:
  - type: Documentation
    url: https://docs.lido.fi/integrations/api
  - type: Endpoint
    url: https://wq-api.lido.fi/v2/request-time
  - type: Endpoint
    url: https://wq-api.lido.fi/v2/request-time/calculate
  - type: Endpoint
    url: https://wq-api-hoodi.testnet.fi/v2/request-time
- aid: lido:lido-keys-api
  name: Lido Keys API
  description: Service that exposes node operator validator keys from each Lido staking
    module (Curated, Simple DVT, CSM) for use by deposit security infrastructure,
    validator monitoring, and integrators. Open-source under `lidofinance/lido-keys-api`.
  humanURL: https://github.com/lidofinance/lido-keys-api
